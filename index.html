<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color System — Curated design library</title>
    <meta name="description" content="245 hand-vetted colors across 22 hue families, plus 46 ready-made palettes for 15 site types. Search in Thai or English, preview on a page mockup, copy with one click." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='8' width='6' height='12' rx='3' fill='hsl(36%2C72%25%2C55%25)'/%3E%3Crect x='9' y='3' width='6' height='17' rx='3' fill='hsl(156%2C72%25%2C55%25)'/%3E%3Crect x='17' y='11' width='6' height='9' rx='3' fill='hsl(276%2C72%25%2C55%25)'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Apply saved / system theme before first paint (avoids light flash) -->
    <script>
      ;(function () {
        try {
          var s = localStorage.getItem('ct-theme')
          var dark = s
            ? s === 'dark'
            : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
